plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.meetodo'
version = '0.0.1-SNAPSHOT'
description = 'Meeting notes to actionable tasks'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.ai:spring-ai-bom:1.1.8'
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
    implementation 'org.flywaydb:flyway-core'
    implementation 'com.slack.api:bolt-socket-mode:1.54.0'
    implementation 'javax.websocket:javax.websocket-api:1.1'
    implementation 'org.glassfish.tyrus.bundles:tyrus-standalone-client:1.20'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // Local credentials must not enable real webhook transports in profile-matrix tests.
    environment 'MEETODO_SLACK_BOT_ENABLED', 'false'
    environment 'MEETODO_SLACK_DM_ENABLED', 'false'
    environment 'SLACK_APP_TOKEN', ''
    environment 'SLACK_BOT_TOKEN', ''
    environment 'MEETODO_DIGEST_ENABLED', 'false'
    environment 'NOTIFIER_TYPE', 'none'
    environment 'SLACK_WEBHOOK_URL', ''
    environment 'DISCORD_WEBHOOK_URL', ''
}
