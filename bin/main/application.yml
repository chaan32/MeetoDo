spring:
  application:
    name: meetodo
  profiles:
    default: local
  jpa:
    open-in-view: false
  ai:
    # The OpenAI starter includes several models. Enable only chat, explicitly,
    # in application-openai.yml when an API key is available.
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        transcription: none
        speech: none

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
