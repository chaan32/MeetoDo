server:
  address: 0.0.0.0

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/meetodo}
    username: ${DB_USERNAME:meetodo}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

meetodo:
  dev:
    endpoints-enabled: ${MEETODO_DEV_ENDPOINTS_ENABLED:false}
