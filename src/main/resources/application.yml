spring:
  application:
    name: meetodo
  profiles:
    default: local
  flyway:
    enabled: false
  jpa:
    open-in-view: false
  ai:
    # The OpenAI starter includes several models. Enable only chat, explicitly,
    # in application-openai.yml when an API key is available.
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        transcription: none
        speech: none

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Opt-in weekday digest; manual local endpoint is available independently.
meetodo:
  digest:
    enabled: ${MEETODO_DIGEST_ENABLED:false}
    cron: ${MEETODO_DIGEST_CRON:0 0 9 * * MON-FRI}

# SDK diagnostics may include Slack payloads or connection URLs; our boundary logs safe codes only.
logging:
  level:
    com.slack.api: OFF
    org.glassfish.tyrus: OFF
