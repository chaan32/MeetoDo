# Local development only. The database remains under ./data after restart.
server:
  address: 127.0.0.1

spring:
  datasource:
    url: jdbc:h2:file:./data/meetodo
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/local/slack-message-dm-upgrade.sql,classpath:db/local/member-management-upgrade.sql,classpath:db/local/task-management-upgrade.sql
  jpa:
    hibernate:
      ddl-auto: update
